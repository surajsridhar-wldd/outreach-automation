name: Nudge run

# Started on time by a Supabase pg_cron job calling the workflow_dispatch API (GitHub's own
# schedule is too late and too irregular for an 11:00 IST send window). It can also be started by
# hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Optional: force a SAFER mode for this run (shadow or rehearsal). Leave empty to use the database setting."
        required: false
        type: choice
        default: ""
        options: ["", "shadow", "rehearsal"]
      task:
        description: "run = a normal run. selfcheck = test every database and sending path with throwaway data (sends one email to the owner)."
        required: false
        type: choice
        default: "run"
        options: ["run", "selfcheck", "llmcheck"]
      as_of:
        description: "Optional, shadow/rehearsal only: plan as if it were this moment, e.g. 2026-09-21T05:30:00Z (= Monday 11:00 IST)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Never two runs at once.
concurrency:
  group: nudge-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_MODE: ${{ inputs.mode }}
      AS_OF: ${{ inputs.as_of }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TEAM_SHEET_URL: ${{ secrets.TEAM_SHEET_URL }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Run
        if: inputs.task == 'run' || inputs.task == ''
        run: node run.js
      - name: Self-check
        if: inputs.task == 'selfcheck'
        run: node selfcheck.js
      - name: Model check
        if: inputs.task == 'llmcheck'
        run: node llmcheck.js
      - name: Zero-cost check (read-only)
        if: inputs.task == 'zerocheck'
        run: node zerocheck.js
      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: worker/report.md
          if-no-files-found: ignore
          retention-days: 30
